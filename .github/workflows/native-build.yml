name: native-build

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: "Ref to build from (e.g. v1.0.0)"
      useWorkflowSpec:
        type: boolean
        default: false
        description: "Use build files from workflow branch instead of tag"
  push:
    tags:
      - "v*"

jobs:
  build:
    if: ${{ vars.REGISTRY == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64

    permissions:
      packages: write
      contents: write

    env:
      PYTHON_VERSION: "3.13"
      BUN_VERSION: "1.4.2"
      NODE_VERSION: 22
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
      TOOL_ARCH: ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}
      UV_CACHE_DIR: .uv-cache

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Checkout build files from workflow branch
        if: ${{ github.event.inputs.useWorkflowSpec == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            app.spec
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false
          path: temp-build

      - name: Replace build files from workflow branch
        if: ${{ github.event.inputs.useWorkflowSpec == 'true' }}
        shell: bash
        run: |
          cp temp-build/app.spec ./app.spec
          cp temp-build/pyproject.toml ./pyproject.toml
          cp temp-build/uv.lock ./uv.lock

      - name: Update app/library/version.py
        shell: bash
        run: |
          VERSION="${TAG_NAME}"
          SHA=$(git rev-parse HEAD)
          DATE=$(date -u +"%Y%m%d")
          BRANCH=$(git branch --show-current)

          if [ -z "${BRANCH}" ]; then
            BRANCH="${TAG_NAME}"
          fi

          BRANCH=$(echo "${BRANCH}" | sed 's#/#-#g')

          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_SHA=${SHA}" >> "$GITHUB_ENV"
          echo "APP_DATE=${DATE}" >> "$GITHUB_ENV"
          echo "APP_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

          sed -i.bak \
            -e "s/^APP_VERSION = \".*\"/APP_VERSION = \"${VERSION}\"/" \
            -e "s/^APP_COMMIT_SHA = \".*\"/APP_COMMIT_SHA = \"${SHA}\"/" \
            -e "s/^APP_BUILD_DATE = \".*\"/APP_BUILD_DATE = \"${DATE}\"/" \
            -e "s/^APP_BRANCH = \".*\"/APP_BRANCH = \"${BRANCH}\"/" \
            app/library/version.py

          rm -f app/library/version.py.bak

          echo "Updated version info:"
          cat app/library/version.py

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ env.TOOL_ARCH }}

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-

      - name: Set up OpenSSL for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # cryptography builds from source because it has no Windows ARM64 wheel.
          vcpkg install openssl:arm64-windows-static-md --host-triplet arm64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Install Python dependencies
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python -m pip install uv
          uv sync --locked --no-dev --extra installer

      - name: Cache bun installation
        id: cache-bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-bun-

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ env.TOOL_ARCH }}

      - name: Build frontend
        working-directory: ui
        shell: bash
        run: |
          bun install --production --prefer-offline --frozen-lockfile
          bun run generate

      - name: Clean build outputs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: rm -rf build dist release || true

      - name: Clean build outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build)   { Remove-Item -Recurse -Force build }
          if (Test-Path dist)    { Remove-Item -Recurse -Force dist }
          if (Test-Path release) { Remove-Item -Recurse -Force release }

      - name: Build native binary
        shell: bash
        run: uv run --no-sync python -m PyInstaller app.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ runner.os }}-${{ matrix.arch }}-${{ env.TAG_NAME }}
          path: dist/YTPTube/**

      - name: Package artifact (Unix)
        if: startsWith(env.TAG_NAME, 'v') && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          PKG_DIR="YTPTube-${{ env.TAG_NAME }}"
          ZIP_NAME="ytptube-${{ runner.os }}-${{ matrix.arch }}-${{ env.TAG_NAME }}.zip"

          if [ ! -f "dist/YTPTube/YTPTube" ]; then
            echo "Missing dist/YTPTube/YTPTube"
            find dist -maxdepth 3 -type f | head -n 200
            exit 1
          fi

          rm -rf "dist/${PKG_DIR}"
          mv "dist/YTPTube" "dist/${PKG_DIR}"

          zip -yr "release/${ZIP_NAME}" "dist/${PKG_DIR}"

      - name: Package artifact (Windows)
        if: startsWith(env.TAG_NAME, 'v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgDir = "YTPTube-${{ env.TAG_NAME }}"
          $zipName = "ytptube-${{ runner.os }}-${{ matrix.arch }}-${{ env.TAG_NAME }}.zip"
          New-Item -ItemType Directory -Force -Path release | Out-Null

          if (!(Test-Path "dist\YTPTube\YTPTube.exe")) {
            Write-Host "Missing dist\YTPTube\YTPTube.exe"
            Get-ChildItem -Recurse dist | Select-Object -First 200 | Format-Table -AutoSize
            exit 1
          }

          if (Test-Path "dist\$pkgDir") { Remove-Item -Recurse -Force "dist\$pkgDir" }
          Move-Item "dist\YTPTube" "dist\$pkgDir"

          Compress-Archive -Path "dist\$pkgDir" -DestinationPath "release\$zipName" -Force

      - name: Upload to GitHub Release
        if: startsWith(env.TAG_NAME, 'v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: release/*.zip
