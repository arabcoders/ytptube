services:
  ytptube:
    image: ghcr.io/arabcoders/ytptube:latest
    container_name: ytptube
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # All envs: https://github.com/arabcoders/ytptube/blob/master/FAQ.md#environment-variables
      TZ: "${TZ:-UTC}"
      YTP_TEMP_PATH: /downloads/tmp
      YTP_DOWNLOAD_PATH: /downloads/files
      # Optional browser and FlareSolverr URLs, remove if not using browser extraction or FlareSolverr.
      YTP_BROWSER_URL: http://127.0.0.1:9222
      YTP_FLARESOLVERR_URL: http://flaresolverr:8191/v1
    ports:
      - "8081:8081"
      # Optional local Chrome desktop: https://localhost:3001
      # - "127.0.0.1:3001:3001"
    volumes:
      - ./config:/config:rw
      - ./downloads:/downloads:rw
      # Replace the downloads bind mount above when using network storage.
      # - ./downloads:/downloads/local:rw
      # - nfs-data:/downloads/nfs:rw
      # - smb-data:/downloads/smb:rw
    # Hardware acceleration requires host-specific devices and group IDs.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${VIDEO_GID:-44}"
    #   - "${RENDER_GID:-105}"

  # Everything below is optional and can be customized according to your setup.
  chrome:
    image: lscr.io/linuxserver/chrome:latest
    container_name: chrome
    restart: unless-stopped
    # Share loopback so YTPTube can reach Chrome's debug port without publishing it.
    network_mode: "service:ytptube"
    shm_size: "1gb"
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      TZ: "${TZ:-UTC}"
      RESTART_APP: "true"
      CHROME_CLI: >-
        --remote-debugging-port=9222
        --user-data-dir=/config/chromium
    volumes:
      - ./chrome-config:/config

  flaresolverr:
    image: docker.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped

# Replace the addresses, paths, credentials, and mount options before enabling.
