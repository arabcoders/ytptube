<style>
  #ytptube-spa-loading {
    color-scheme: dark;
    --bg: #08111d;
    --bg-deep: #0f172a;
    --panel: rgb(15 23 42 / 0.84);
    --border: rgb(148 163 184 / 0.16);
    --shadow: rgb(2 6 23 / 0.45);
    --text: #e7eef9;
    --muted: #9fb0c7;
    --accent: #f87171;
    --accent-soft: rgb(248 113 113 / 0.18);
    position: fixed;
    inset: 0;
    padding: 1rem;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--text);
    user-select: none;
    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      sans-serif;
    background:
      radial-gradient(circle at top left, var(--accent-soft), transparent 24%),
      linear-gradient(180deg, var(--bg-deep), var(--bg));
  }

  .light #ytptube-spa-loading {
    color-scheme: light;
    --bg: #edf2f9;
    --bg-deep: #dbe5f1;
    --panel: rgb(255 255 255 / 0.84);
    --border: rgb(15 23 42 / 0.1);
    --shadow: rgb(15 23 42 / 0.14);
    --text: #0f172a;
    --muted: #5b6b80;
    --accent: #dc2626;
    --accent-soft: rgb(220 38 38 / 0.18);
  }

  #ytptube-spa-loading::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
    background-size: 2rem 2rem;
    opacity: 0.32;
  }

  #ytptube-spa-loading .loading-card {
    box-sizing: border-box;
    min-width: min(400px, calc(100vw - 2rem));
    width: min(100%, 29rem);
    position: relative;
    padding: 1.65rem;
    border: 1px solid var(--border);
    border-radius: 1.1rem;
    background: var(--panel);
    box-shadow: 0 1rem 2.5rem var(--shadow);
    backdrop-filter: blur(16px);
  }

  #ytptube-spa-loading .brand {
    display: flex;
    align-items: center;
    gap: 0.95rem;
  }

  #ytptube-spa-loading .brand img {
    width: 2.8rem;
    height: 2.8rem;
    flex: none;
    display: block;
    object-fit: contain;
  }

  #ytptube-spa-loading .brand-copy {
    min-width: 0;
  }

  #ytptube-spa-loading .label {
    margin: 0;
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #ytptube-spa-loading h1 {
    margin: 0.35rem 0 0;
    font-size: 1.55rem;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  #ytptube-spa-loading .description {
    margin: 1rem 0 0;
    color: var(--muted);
    font-size: 0.96rem;
    line-height: 1.55;
  }

  #ytptube-spa-loading .loader {
    margin-top: 1.2rem;
    height: 0.32rem;
    overflow: hidden;
    border-radius: 999px;
    background: rgb(148 163 184 / 0.22);
  }

  #ytptube-spa-loading .loader::before {
    content: '';
    display: block;
    width: 36%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: ytptube-spa-slide 1.35s ease-in-out infinite;
  }

  #ytptube-spa-loading .hint {
    margin: 0.95rem 0 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  @keyframes ytptube-spa-slide {
    from {
      transform: translateX(-130%);
    }

    to {
      transform: translateX(330%);
    }
  }

  @media (max-width: 560px) {
    #ytptube-spa-loading {
      padding-top: calc(1rem + env(safe-area-inset-top));
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }

    #ytptube-spa-loading .loading-card {
      padding: 1.3rem;
      transform: translateY(clamp(-2.75rem, -7vh, -1.5rem));
    }

    #ytptube-spa-loading .brand {
      align-items: flex-start;
    }

    #ytptube-spa-loading h1 {
      font-size: 1.35rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #ytptube-spa-loading .loader::before {
      animation: none;
    }
  }
</style>

<div id="ytptube-spa-loading">
  <main class="loading-card" role="status" aria-live="polite" aria-busy="true">
    <div class="brand">
      <img src="images/favicon.png" alt="" aria-hidden="true" />

      <div class="brand-copy">
        <p class="label">YTPTube</p>
        <h1>Loading App</h1>
      </div>
    </div>

    <p class="description">Getting the interface ready.</p>

    <div class="loader" aria-hidden="true"></div>
    <p class="hint">Please wait.</p>
  </main>
</div>
